# ─────────────────────────────────────────────────────────────
# Textile QC - Nginx Host Configuration Template
# Place in: /etc/nginx/sites-available/textile-qc
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name textileapperal.com www.textileapperal.com;

    # Limit file uploads
    client_max_body_size 20M;

    # Let's Encrypt Acme Challenge validation directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # API Proxy → FastAPI backend running on Docker port 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Proxy → Next.js frontend running on Docker port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
